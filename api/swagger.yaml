      * `CHILD` - As a child of insert_after_element
    required: false
    type: string
    enum: 
      - SIBLING
      - CHILD
    
  offset:
    name: offset    
    in: query
    description: Start index for pagination. zero based.
    required: false
    type: integer
    default: 0
    
  limit:
    name: limit
    in: query
    description: Max number of elements to return.
    required: false
    type: integer
    default: 50
    
  sort:
    name: sort
    in: query
    description: |
          Sort in natural order
          * `ASC` - Ascending
          * `DESC` - Descending
    required: false
    type: string
    enum:
