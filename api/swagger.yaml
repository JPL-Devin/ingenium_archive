swagger: "2.0"
info:
  description: "Ingenium Archival Start"
  version: "5.0.0"
  title: "Archive"
host: "127.0.0.1:8010"
basePath: /api/v5
schemes:
- "http"
consumes:
- "application/json"
produces:
- "application/json"

securityDefinitions:
  UserSecurity:
    # Technically, this service uses JWT and the type should be apiKey.
    # But apiKey type of swagger does not support scopes since scope is not part of the JWT specs.
    # Instead use oauth2 as the type so that we can define scopes in swagger and we can use the 
    # swagger tools middleware to handle authorization. This approach may not be semantically correct but
    # is a practical get-around approach.
    type: oauth2
    authorizationUrl: www.sample.com
    flow: implicit
    scopes:
      admin: Administrative permission such as adding venues, managing users, etc.
      execute:wsts: Execute procedures on WSTS Venues
      execute:testbed: Execute procedures on Testbed Venues
      execute:sit: Execute procedures on System I&T Venues
      execute:other: Execute procedures on other Venues
      config_mgmt: Make changes to project configurations such as command dictionary
      imcm: Information management configuration management to release procedure
      test_lead: Test lead
      author: authoring procedure
      basic: basic level permission that includes adding comments

# Any scope can be used by default
security:
  - UserSecurity: ["admin", "execute:wsts", "execute:testbed", "execute:sit", "execute:other", "config_mgmt", "imcm", "test_lead", "author", "basic"] 

paths:

  /executions:
    post:
      tags:
        - Execution
      description: "Create an execution"
      operationId: "create_execution"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]           
      parameters:
        - name: execution
          in: body
          description: "Execution meta data"
          required: true
          schema:
            $ref: "#/definitions/ExecutionInfoInput"      
      responses:
        200:
          description: "Created"
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
            
    get:
      tags:
        - Execution
      description: Get a list of executions. List is sorted by start date by default (latest first).
      operationId: get_executions
      parameters:
        - $ref: "#/parameters/offset"      
        - $ref: "#/parameters/limit"
        - $ref: "#/parameters/sort"     
        - name: sort_by
          in: query
          description: sort by this parameter
          required: false
          type: string
          enum:
            - EXECUTION_ID
            - TIME_STARTED
            - TIME_COMPLETED
            - VENUE_NAME               
            - STATUS        
        - name: execution_id
          in: query
          description: filter by execution_id
          required: false
          type: string        
        - $ref: "#/parameters/description"                
        - name: status
          in: query
          description: filter by status
          required: false
          type: string
          enum:
            - RUNNING
            - IDLE
            - PAUSED
            - HALTED
            - SUSPENDED
            - CLOSED
            - IN_REVIEW          
            - FINALIZED        
        - name: statuses
          in: query
          description: comma separated list of statuses
          required: false
          type: string      
        - $ref: "#/parameters/completed"     
        - name: from_time
          in: query
          description: search from this time (execution start time in UTC such as 2021-01-07T02:56:23.877Z)
          required: false
          type: string
        - name: to_time
          in: query
          description: search up to this time (execution start time in UTC such as 2021-01-07T02:56:23.877Z)
          required: false
          type: string            
        - name: venue_id
          in: query
          description: filter by venue id
          required: false
          type: string
        - name: venue_name
          in: query
          description: filter by venue name
          required: false
          type: string     
        - name: venue_type
          in: query
          description: filter by venue type
          required: false
          type: string     
          enum:
            - WSTS
            - Testbed
            - ATLO
            - Other                   
        - name: run_for_score
          in: query
          description: filter by run for score flag
          required: false
          type: boolean                   
        - name: test_conductor
          in: query
          description: filter by test_conductor
          required: false
          type: string                     
        - name: procedure_id
          in: query
          description: filter by procedure_id used in the execution
          required: false
          type: string
        - name: version
          in: query
          description: filter by procedure version used in the execution. procedure_id must be specified.
          required: false
          type: integer            
        - name: institutional_id    
          in: query
          description: filter by institutional id of procedure used in the execution
          required: false
          type: string                             
        - name: institutional_release_id  
          in: query
          description: filter by institutional release id of procedure version used in the execution. institutional_id must be specified.
          required: false
          type: string           
   
      responses:
        200:
          description: "Success"
          headers:
            x-total-count:
              description: The total number of resources
              type: integer    
          schema:
            type: "array"
            title: "ExecutionArray"
            items:
              $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse" 
            
    x-swagger-router-controller: Execution              

  /executions/import:
    post:
      tags:
        - Execution
      description: Import execution, elements and edges
      operationId: import_execution
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other", "config_mgmt"]
      parameters:
        - name: import_input
          in: body
          description: Execution, elements and edges
          required: false
          schema:
            $ref: "#/definitions/ExecutionData"    
      responses:
        204:
          description: Imported
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse" 
    
    x-swagger-router-controller: Execution    

  /executions/{execution_id}:
    get:
      tags:
        - Execution
      description: "Get meta data of an execution"
      operationId: "get_execution"
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    patch:
      tags:
        - Execution
      description: "Update meta data of an execution"
      operationId: "update_execution"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]          
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: execution_meta_data
          in: body
          description: meta data of execution
          required: true
          schema:
            $ref: "#/definitions/ExecutionInfo"         
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"     
            
    delete:
      tags:
        - Execution
      description: "Delete an execution"
      operationId: "delete_execution"   
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]          
      parameters:
        - $ref: "#/parameters/execution_id"      
      responses:
        204:
          description: "Deleted"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
    
    x-swagger-router-controller: Execution              

  /executions/{execution_id}/export:
    get:
      tags:
        - Execution
      description: Get execution info, elements and edges
      operationId: "export_execution"
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        200:
          description: execution, elements and edges
          schema:
            $ref: "#/definitions/ExecutionData"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
    
    x-swagger-router-controller: Execution

  /executions/{execution_id}/status:
    get:
      tags:
        - Execution
      description: "Get the current status of the execution"
      operationId: "get_execution_status"
      parameters:
        - $ref: "#/parameters/execution_id"      
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/ExecutionStatus"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
    post:
      tags:
        - Execution
      description: "Update the current status of the execution"
      operationId: "update_execution_status"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]          
      parameters:
        - $ref: "#/parameters/execution_id"      
        - name: execution_status
          in: body
          description: status of the execution
          required: true
          schema:
            $ref: "#/definitions/ExecutionStatusInput" 
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"   

    x-swagger-router-controller: Execution                         

  /executions/{execution_id}/next_elem:
    get:
      tags:
        - Execution
      description: Get the element next to the specified element
      operationId: get_next_element
      parameters:
        - $ref: "#/parameters/execution_id"  
        - name: elem_id
          in: query
          description: id of the reference element
          required: true
          type: string      
        - name: executable
          in: query
          description: true if consider only executable element (step or procedure section)
          required: false
          default: false
          type: boolean                 
      responses:
        200:
          description: Element 
          schema:
            $ref: "#/definitions/ProcedureElement"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution            
     
  /executions/{execution_id}/boundary_elem:
    post:
      tags:
        - Execution
      description: Set boundary_elem_id to determine the scope of AUTO execution
      operationId: set_boundary_element
      parameters:
        - $ref: "#/parameters/execution_id"  
        - name: elem_id
          in: query
          description: id of the element for which execution starts
          required: true
          type: string                           
      responses:
        200:
          description: Execution 
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution   

  /executions/{execution_id}/steps:
    post:
      tags:
        - Execution
      description: Create a step
      operationId: create_execution_step
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]          
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/insert_after_id"
        - $ref: "#/parameters/level"
        - name: step
          in: body
          description: step definition including its type
          required: true
          schema:
            $ref: "#/definitions/Step"       
      responses:
        200:
          description: Created
          schema:
            $ref: "#/definitions/AddStepResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
    get:
      tags:
        - Execution
      description: Get steps of the execution. List is sorted by the order in the execution.
      operationId: get_execution_steps
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/offset"      
        - $ref: "#/parameters/limit"      
        - $ref: "#/parameters/sort"
        - $ref: "#/parameters/description"                
      responses:
        200:
          description: "Success"
          headers:
            x-total-count:
              description: The total number of resources
              type: integer              
          schema:
            type: array
            items:
              $ref: '#/definitions/Step'
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
    
    x-swagger-router-controller: Execution               
            
  /executions/{execution_id}/elements:
    get:
      tags:
      - Execution
      description: Get elements of the specified type from execution. List is sorted by the order in the execution.
      operationId: get_execution_elements
      parameters:
        - $ref: "#/parameters/execution_id" 
        - $ref: "#/parameters/elem_type"      
        - $ref: "#/parameters/step_type"
        - $ref: "#/parameters/offset"      
        - $ref: "#/parameters/limit"
        - $ref: "#/parameters/sort"
        - $ref: "#/parameters/description"
        - $ref: "#/parameters/all_elements"                
        - $ref: "#/parameters/comment_filter"
        - $ref: "#/parameters/ar_comment_filter"
        - $ref: "#/parameters/dr_comment_filter"
      responses:
        200:
          description: |
            Array of elements of an execution that matches the query criteria.
            Step element may include run_records of previous runs of the step as defined in StepWithRunRecords data model.       
          headers:
            x-total-count:
              description: The total number of resources
              type: integer
          schema:
            type: "array"
            title: "elements"
            items:
              $ref: "#/definitions/ProcedureElement"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    
    patch:
      tags:
      - Execution
      description: Update elements
      operationId: update_execution_elements
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]          
      parameters:
        - $ref: "#/parameters/execution_id"   
        - name: elems_input
          in: body
          description: elements to be updated
          required: true
          schema:
            type: array
            items:
              $ref: "#/definitions/ProcedureElement"   
      responses:
        200:
          description: updated elements       
          schema:
            type: "array"
            title: "elements"
            items:
              $ref: "#/definitions/ProcedureElement"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"              
    
    x-swagger-router-controller: Execution      
    
  /executions/{execution_id}/simple_elements:
    get:
      tags:
      - Execution
      description: Get elements of execution (only key fields)
      operationId: get_execution_simple_elements
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        200:
          description: |
            Array of elements of an execution (only key fields of elements)       
          headers:
            x-total-count:
              description: The total number of resources
              type: integer
          schema:
            type: "array"
            title: "elements"
            items:
              $ref: "#/definitions/ProcedureSimpleElement"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    

    x-swagger-router-controller: Execution      

  /executions/{execution_id}/outline:
    get:
      tags:
        - Execution
      description: Get outline view of execution
      operationId: get_execution_outline
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        200:
          description: "Outline elements"
          schema:
            type: "array"
            title: "elements"
            items:
              $ref: "#/definitions/OutlineElement"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
    
    x-swagger-router-controller: Execution      
            
  /executions/{execution_id}/elements/move:
    post:
      tags:
      - Execution
      description: Move elements and their children to another location in execution
      operationId: move_execution_element
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]          
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: move_element_input
          in: body
          schema:
            $ref: "#/definitions/MoveElementInput"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/MoveElementsResponse"            
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    
    
    x-swagger-router-controller: Execution       
            
  /executions/{execution_id}/elements/copy:
    post:
      tags:
      - Execution
      description: Copy elements and their children to another location in execution
      operationId: copy_execution_element
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]          
      parameters:
        - $ref: "#/parameters/execution_id"                   
        - name: copy_element_input
          in: body
          schema:
            $ref: "#/definitions/CopyElementInput"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/CopyElementResponse"            
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    
    
    x-swagger-router-controller: Execution  

  /executions/{execution_id}/elements/discard:
    post:
      tags:
        - Execution
      description: discard redline/blueline elements
      operationId: "execution_discard_elements"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: discard_input
          in: body
          required: true
          schema:
            $ref: "#/definitions/DiscardInput"  
      responses:
        200:
          description: Element modifications discarded
          schema:
            $ref: "#/definitions/DiscardElementResponse"      
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    

    x-swagger-router-controller: Execution     
    
  /executions/{execution_id}/elements/{elem_id}/conversations:
    post:
      tags:
        - Comment
      description: Add a conversation to an element
      operationId: element_add_conversation
      security:
        - UserSecurity: ["basic"]
      parameters:
        - $ref: "#/parameters/execution_id"      
        - $ref: "#/parameters/elem_id"
        - name: conversation
          in: body
          description: conversation to add
          required: true
          schema:
            $ref: "#/definitions/ConversationInput"
      responses:
        200:
          description: Created
          schema:
            $ref: "#/definitions/Conversation"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
    get:
      tags:
        - Comment
      description: Get a list of conversations for an element. List is ordered by the creation date (ascending order).
      operationId: element_get_conversations
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
        - $ref: "#/parameters/offset"
        - $ref: "#/parameters/limit"
        - $ref: "#/parameters/sort"
      responses:
        200:
          description: "Success"
          headers:
            x-total-count:
              description: The total number of resources
              type: integer
          schema:
            type: array
            title: conversations
            items:
              $ref: "#/definitions/Conversation"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Comment    
    
  /executions/{execution_id}/elements/{elem_id}/conversations/{conversation_id}:
    get:
      tags:
        - Comment
      description: Get a conversation of an element"
      operationId: element_get_conversation
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
        - $ref: "#/parameters/conversation_id"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/Conversation"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
    patch:
      tags:
        - Comment
      description: Update a conversation of an element"
      operationId: element_update_conversation
      security:
        - UserSecurity: ["basic"]
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
        - $ref: "#/parameters/conversation_id"
        - name: conversation
          in: body
          description: conversation to update
          required: true
          schema:
            $ref: "#/definitions/ConversationInput"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/Conversation"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
    delete:
      tags:
        - Comment
      description: "Delete a conversation"
      operationId: "element_delete_conversation"
      security:
        - UserSecurity: ["basic"]
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
        - $ref: "#/parameters/conversation_id"
      responses:
        204:
          description: "Deleted"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Comment    

  /executions/{execution_id}/elements/{elem_id}/conversations/{conversation_id}/comments:
    post:
      tags:
        - Comment
      description: Add a comment to an element
      operationId: element_add_comment
      security:
        - UserSecurity: ["basic"]
      parameters:
        - $ref: "#/parameters/execution_id"      
        - $ref: "#/parameters/elem_id"
        - $ref: "#/parameters/conversation_id"
        - name: comment
          in: body
          description: comment to add
          required: true
          schema:
            $ref: "#/definitions/CommentInput"

      responses:
        200:
          description: Created
          schema:
            $ref: "#/definitions/Comment"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
    get:
      tags:
        - Comment
      description: Get a list of comments for an element. List is ordered by the creation date (ascending order).
      operationId: element_get_comments
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
        - $ref: "#/parameters/conversation_id"
        - $ref: "#/parameters/offset"
        - $ref: "#/parameters/limit"
        - $ref: "#/parameters/sort"
      responses:
        200:
          description: "Success"
          headers:
            x-total-count:
              description: The total number of resources
              type: integer
          schema:
            type: array
            title: comments
            items:
              $ref: "#/definitions/Comment"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Comment
            
  /executions/{execution_id}/elements/{elem_id}/conversations/{conversation_id}/comments/{comment_id}:
    get:
      tags:
        - Comment
      description: Get a comment of an element"
      operationId: element_get_comment
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
        - $ref: "#/parameters/conversation_id"
        - $ref: "#/parameters/comment_id"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/Comment"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
    patch:
      tags:
        - Comment
      description: Update a comment of an element"
      operationId: element_update_comment
      security:
        - UserSecurity: ["basic"]
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
        - $ref: "#/parameters/conversation_id"
        - $ref: "#/parameters/comment_id"  
        - name: comment
          in: body
          description: comment to update
          required: true
          schema:
            $ref: "#/definitions/CommentInput"             
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/Comment"           
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"             
    delete:
      tags:
        - Comment
      description: "Delete a comment"
      operationId: "element_delete_comment"
      security:
        - UserSecurity: ["basic"]
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
        - $ref: "#/parameters/conversation_id"
        - $ref: "#/parameters/comment_id"
      responses:
        204:
          description: "Deleted"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Comment          
            
  /executions/{execution_id}/as_run:
    get:
      tags:
        - Execution
      description: "Get as run report for an execution"
      operationId: "get_execution_as_run"
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/offset"      
        - $ref: "#/parameters/limit"
        - $ref: "#/parameters/sort"        
      responses:
        200:
          description: |
            Elements of as run report. A list of nested procedure elements. 
            Note that the spec is correct but Swagger UI will show undefined since it does not handle recursive data structure.
