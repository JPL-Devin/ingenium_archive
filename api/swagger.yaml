definitions:

  ProcedureSimpleElement:
    properties:
      elem_id:
        type: string
        description: The unique identifier of the element  
      number:
        type: string
        description: element number in procedure or execution        
      title:
        type: string
      elem_type:
        type: string
        description: Type of the element        
        enum:   
        - SECTION
        - PROCEDURE_SECTION
        - PARAGRAPH
        - STEP
      executable:
        type: string
        description: type of execution supported for the element
        enum:
          - EXECUTED
          - COMPUTED
          - NONE    
      break_point:
        type: string
        description: stop automatic execution when reaching this element
        enum:
          - NONE
          - ACTIVE
          - INACTIVE       
      parent_id:
        type: string
        description: id of the parent element. empty string for elements that are direct children of execution or procedure 
      procedure_section_id:
        type: string
        description: id of the procedure section to which this element belongs. Empty string if none.
      procedure_modification_status:
        type: string
        description: |
          whether any redline/blueline is associated with the element
          * `NONE` - Not under run for score
          * `ORIGINAL` - Original from procedure
          * `MODIFIED` - Replaced by a redline
          * `MODIFYING` - Redline/blueline element that replaces the original element
          * `MODIFYING_OLD` - A modifying element that has been overtaken by another modifying element 
          * `DELETED` - Redlined/bluelined by deletion
          * `ADDED` - Redlined/bluelined by addition
        enum:
          - NONE
          - ORIGINAL
          - MODIFIED
          - MODIFYING
          - MODIFYING_OLD
          - DELETED
          - ADDED                               
      procedure_modification:
        $ref: '#/definitions/ProcedureModification'

  ProcedureElement:
    allOf:
    - $ref: '#/definitions/ProcedureSimpleElement'
    - type: object    
      properties:
        procedure_id:
          type: string
          description: id of the procedure to which the element belongs (empty string for elements of execution without procedure)        
        procedure_title:
          type: string
          description: title of the procedure to which this element belongs. Empty string if none.
        executed:
          type: boolean
          description: true if this element has been executed
        verifiable:
          type: boolean
          description: true if this element has pass/fail status                            
        run_for_score:
          type: boolean         
          description: true if this element is a part of run for score procedure        
        execution_id:
          type: string
          description: id of the execution to which the element belongs (empty string for elements of procedure)
        description:
          type: string
        files:
          type: array
          items:
            $ref: '#/definitions/FileInfo'    
        conversations:
          type: array
          items:
            $ref: '#/definitions/Conversation'
        tag_ids:
          description: applied tags
          type: array
          items:
            type: string                          
  
  FileInfo:
    type: object
    description: Meta data of an attached file
    properties:
      file_id:
        type: string
        description: unique id of the file resource
      file_name:
        type: string
        description: original name of the file   
      url:
        type: string
        description: download url of the file

  ProcedureConversationInput:
    properties:
      type:
        type: string
        description: type of comment
        enum:   
        - COMMENT
      status:
        description: status of this conversation
        type: string
        enum:   
        - UNRESOLVED
        - RESOLVED        

  ProcedureConversation:
    allOf:
    - $ref: '#/definitions/ProcedureConversationInput'
    - type: object    
      properties:
        conversation_id:  
          type: string
          description: id of the conversation
        time_resolved:
          description: Time the conversation was resolved
          type: string
        resolved_by:
          description: name of the user who resolved the conversation
          type: string
        comments:
          type: array
          items:
            $ref: '#/definitions/Comment' 
                    
  ConversationInput:
    properties:
      type:
        type: string
        description: type of comment
        enum:   
        - COMMENT
        - ACTIVITY_REPORT_COMMENT
        - DATA_REVIEW_COMMENT
      status:
        description: status of this conversation
        type: string
        enum:   
        - UNRESOLVED
        - RESOLVED        

  Conversation:
    allOf:
    - $ref: '#/definitions/ConversationInput'
    - type: object    
      properties:
        conversation_id:  
          type: string
          description: id of the conversation
        time_resolved:
          description: Time the conversation was resolved
          type: string
        resolved_by:
          description: name of the user who resolved the conversation
          type: string
        comments:
          type: array
          items:
            $ref: '#/definitions/Comment' 
            
  CommentInput:
    properties:
      content:
        type: string
        description: comment text in HTML
        
  Comment:
    allOf:
    - $ref: '#/definitions/CommentInput'
    - type: object    
      properties:
        comment_id:  
          type: string
          description: id of the comment    
        time_updated:
          description: Time the comment was created or updated
          type: string     
        user_name:
          description: name of the user who commented
          type: string
        files:
          type: array
          items:
            $ref: '#/definitions/FileInfo'        
  

  ProcedureModification:
    description: modification from procedure and its status
    properties:
      justification:
        $ref: '#/definitions/ModificationInfo' 
      approval:
        $ref: '#/definitions/ModificationApproval'

  ModificationInfo:
    description: information about procedure modification
    properties:
      modification_type: 
        description: type of the modification
        type: string
        enum:   
        - NONE
        - REDLINE
        - BLUELINE      
      content:
        type: string
        description: comment text in HTML
      user_name:
        description: Name of the user
        type: string 
      time_updated:
        description: Time the comment was created or updated
        type: string   

  ModificationApproval:
    description: approval status of an element with procedure modifications
    properties:
      content:
        type: string
        description: comment text in HTML
      user_name:
        description: Name of the user who approved the modification 
        type: string 
      time_updated:
        description: Time the modification was approved
        type: string
      status:                
        description: approval status
        type: string
        enum:   
        - PENDING
        - APPROVED          

  ProcedureElementNested:
    allOf:
    - $ref: '#/definitions/ProcedureElement'
    - type: object
      properties:
        children:
          type: array
          items:
            $ref: '#/definitions/ProcedureElementNested'           
          description: child elements
          
  OutlineElement:
    description: element data used for outline of procedure
    properties:
      elem_id:
        type: string
        description: id of the referenced element  
      parent_id:
        type: string
        description: id of the parent element. empty string for elements that are direct children of execution or procedure            
      number:
        type: string
        description: step or section number
      title:
        type: string
        description: element title   
      elem_type:
        type: string
        description: element type
        enum:   
        - SECTION
        - PROCEDURE_SECTION
        - PARAGRAPH
        - STEP
      tag_ids:
        type: array
        description: ids of applied tags
        items:
          type: string
          
  ReferenceProcedureElement:
    description: element data used for outline of elements of subprocedure
    allOf:
    - $ref: '#/definitions/OutlineElement'
    - type: object
      properties:
        selected:
          type: boolean
          description: whether the procedure element was selected for inclusion                

  ExecutionAsRun:
    allOf:
    - $ref: '#/definitions/ExecutionInfo'
    - type: object
      properties:
        children:
          type: array
          items:
            $ref: '#/definitions/ProcedureElementNested'           
          description: child elements     
          
  Step:
    allOf:
    - $ref: '#/definitions/ProcedureElement'
    - type: object
      properties:
        step_type:
          type: string
          description: Type of the element        
          enum:   
            - MANUAL_INPUT
            - MANUAL_EIP
            - VENUE_CONFIG_MANUAL
            - ENVIRONMENT_MANUAL
            - GDS_MANUAL
            - VERIFICATION_ITEM
            - VERIFICATION_ITEM_STATUS
            - GRAPH_EHA
            - QUERY_EVR
            - VERIFY_EHA     
            - WAIT_EHA
            - WAIT_EVR
            - BUS_1553
            - LIST_DATA_PRODUCTS
            - WAIT_DATA_PRODUCTS
            - CMD
            - CMD_FILE
            - CMD_SCMF     
            - CMD_SSE  
            - VENUE_CONFIG_GET
            - VENUE_CONFIG_UPDATE
            - VENUE_CONFIG_CHECK          
            - MANUAL_VERIFICATION
            - CUSTOM_SCRIPT
            - ANALYSIS
            - WAIT  
            - TIME_REFERENCE
            - TOC
        variable:
          $ref: "#/definitions/Variable"
        code:
          $ref: "#/definitions/Code"
        guard:
          type: string
          description: guard condition
        notices:
          type: array
          items:
            $ref: "#/definitions/Notice"  
            
  StepWithRunRecords:
    allOf:
    - $ref: '#/definitions/Step'
    - type: object
      properties:
        run_records:
          description: |
            list of previous runs of the step in the chronological order without including the latest, which is 
            captured in the main body of the data model. Note that this data model is not explicitly used in 
            API specs. But the following end points will use this record for step elements. 
            /executions/{execution_id}/as_run
            /executions/{execution_id}/elements
          type: array
          items:
            $ref: '#/definitions/Step' 

  Section:
    allOf:
    - $ref: '#/definitions/ProcedureElement'

  ProcedureSection:
    allOf:
    - $ref: '#/definitions/Section'
    - type: object
      properties:
        imported:
          type: boolean
          description: true if the referenced procedure has been imported                     
        child_execution_id:
          type: string
          description: id of the execution for the referenced procedure. used for call procedure.        
        authoring_user_input:
          $ref: "#/definitions/ProcedureSectionInput"
        execution_user_input:
          $ref: "#/definitions/ProcedureSectionInput"
          
  ProcedureSectionInput:                    
    properties:
      callable:
        type: boolean
        description: true to execute the procedure in a new execution
      run_for_score:
        description: true if this is run for score
        type: boolean
      reference_procedure_id:
        description: unique id of the procedure referenced
        type: string
      reference_procedure_title:
        description: title of the procedure referenced
        type: string          
      reference_procedure_version:
        description: Version of the procedure referenced
        type: integer
      reference_procedure_version_description:
        description: Description of the version of the procedure referenced
        type: string    
      reference_procedure_institutional_id:
        description: institutional id of the procedure referenced
        type: string
      reference_procedure_institutional_release_id:
        description: institutional release id of the procedure referenced
        type: string               
      tag_selections:
        type: array
        items:
          $ref: '#/definitions/TagSelection'           
        description: selection status of procedure tags        
      elements:
        type: array
        items:
          $ref: '#/definitions/ReferenceProcedureElement'           
        description: elements of the reference procedure
            
  Paragraph:
    allOf:
    - $ref: '#/definitions/ProcedureElement'    
            
  StepExecutionInfo:
    properties:
      test_conductor:
        type: string
        description: User id of the person who ran the step
      time_started:
        description: The time the step execution was started
        type: string
      time_completed:
        description: The time the step execution was completed
        type: string
      time_updated:
        description: The time the step execution status was updated
        type: string           
      status:
        description: |
          execution status of the step
          * `PASS` - Step criteria passed
          * `FAIL` - Step criteria failed
          * `ERROR` - Error in execution
          * `OVERRIDE_PASS` - Status was overriden from fail to pass
          * `OVERRIDE_FAIL` - Status was overriden from pass to fail
          * `RUNNING` - Step is currently running
          * `SKIPPED` - Skipped since guard condition was not met
          * `NONE` - Step execution has not been executed yet
        type: string
        enum:
          - PASS
          - FAIL
          - ERROR
          - OVERRIDE_PASS
          - OVERRIDE_FAIL
          - RUNNING
          - SKIPPED
          - NONE
      status_message:    
        description: additional description of the current status. Typically available for long running steps.
        type: string              
      override_justification:
        description: Rationale of status override
        type: string           
      overridden_by:
        description: User who overrode the status
        type: string          
      time_overridden:
        description: The time when the step execution status was overridden
        type: string
      error:
        $ref: "#/definitions/StepError"      

  StepResult:
    type: object
    required:
      - meta_data    
    description: Results and meta data of a step execution
    properties:
      meta_data:
        $ref: '#/definitions/StepExecutionInfo'    
      results:
        description: Step specific results
        type: object

  ElemIdAndNumber:
    type: object      
    description: element id and order number pair
    properties:
      elem_id:
        description: element id
        type: string
      number:
        description: number of an element
        type: string
      procedure_modification_status:
        type: string
        description: whether any redline/blueline is associated with the element
        enum:
          - NONE
          - ORIGINAL
          - MODIFIED
          - MODIFYING
          - MODIFYING_OLD
          - DELETED
          - ADDED         
      procedure_modification:
        $ref: '#/definitions/ProcedureModification'
      run_for_score:  
        description: true if this is run for score
        type: boolean
      procedure_section_id:
        type: string
        description: id of the procedure section to which this element belongs. Empty string if none.              
      procedure_id:
        type: string
        description: unique id of procedure       
      procedure_title:
        type: string
        description: title of the procedure to which this element belongs. Empty string if none.          
    
  Numbers: 
    type: array
    items:
      $ref: "#/definitions/ElemIdAndNumber"    

  ElemIds: 
    type: array
    description: id's of all elements according to the order in execution or procedure
    items:
      type: string         

  ParentIds: 
    type: array
    description: parent id's of all elements according to the order in execution or procedure
    items:
      type: string

  ModifyElementResponse:
    type: object
    properties:
      elem:
        $ref: "#/definitions/ProcedureElement"
      numbers:
        $ref: "#/definitions/Numbers"
      elem_ids:
        $ref: "#/definitions/ElemIds"         

  DiscardElementResponse:
    type: object
    properties:
      numbers:
        $ref: "#/definitions/Numbers"
      elem_ids:
        $ref: "#/definitions/ElemIds"                
            
  AddStepResponse:
    type: object
    required:
      - elem
      - numbers
    properties:
      elem:
        $ref: "#/definitions/Step"
      numbers:
        $ref: "#/definitions/Numbers"
      elem_ids:
        $ref: "#/definitions/ElemIds"             

  AddSectionResponse:
    type: object
    required:
      - elem
      - numbers
    properties:
      elem:
        $ref: "#/definitions/Section"
      numbers:
        $ref: "#/definitions/Numbers" 
      elem_ids:
        $ref: "#/definitions/ElemIds"        
        
  AddProcedureSectionResponse:
    type: object
    required:
      - elem
      - numbers
    properties:
      elem:
        $ref: "#/definitions/ProcedureSection"
      numbers:
        $ref: "#/definitions/Numbers"
      elem_ids:
        $ref: "#/definitions/ElemIds"                 

  AddParagraphResponse:
    type: object
    required:
      - elem
      - numbers
    properties:
      elem:
        $ref: "#/definitions/Paragraph"
      numbers:
        $ref: "#/definitions/Numbers" 
      elem_ids:
        $ref: "#/definitions/ElemIds"        

  ElementsNumberResponse:
    type: object
    properties:
      numbers:
        $ref: "#/definitions/Numbers"
      elem_ids:
        $ref: "#/definitions/ElemIds"         

  MoveElementsResponse:
    allOf:
    - $ref: '#/definitions/ElementsNumberResponse'
    - type: object
      properties:
        parent_ids:
          $ref: "#/definitions/ParentIds"

  CopyElementInput:
    properties:
      elem_ids:
        description: ids of elements to copy
        type: array
        items:
          type: string
      insert_after_id:
        description: unique id of the element after which element will be added/inserted. To insert at the front, use "-1".
        type: string
      level:
        description: Add as a sibling or a child. If insert_after_id is "-1", level must be empty or "CHILD"
        type: string
        enum:
          - SIBLING
          - CHILD        
      source_execution_id: 
        description: id of the the execution of the source. This will take precedence over source_procedure_id
        type: string
      source_procedure_id:
        description: id of the the procedure of the source. source_procedure_version must be provided as well
        type: string
      source_procedure_version:
        description: version of the the procedure of the source. source_procedure_id must be provided as well
        type: integer

  CopyElementResponse:
    properties:
      elements:
        description: the list of the copied element and its children        
        type: array
        items:
          $ref: '#/definitions/ProcedureElement'           
      numbers:
        $ref: "#/definitions/Numbers"
      elem_ids:
        $ref: "#/definitions/ElemIds"                

  MoveElementInput:
    properties:
      elem_ids:
        description: ids of elements to move
        type: array
        items:
          type: string
      insert_after_id:
        description: unique id of the element after which element will be added/inserted. To insert at the front, use "-1".
        type: string
      level:
        description: Add as a sibling or a child. If insert_after_id is "-1", level must be empty or "CHILD"
        type: string
        enum:
          - SIBLING
          - CHILD

  ReplaceElementInput:
    properties:
      execution_id:
        description: id of the source execution
        type: string
      elem_id:
        description: id of the source element
        type: string
        
  ExecutionInfo:
    type: object
    properties:
      execution_id:
        description: Unique id of the execution
        type: string        
      parent_execution_id:
        description: Unique id of the parent execution if this execution was created by call procedure
        type: string
      parent_procedure_section_id:
        description: Unique id of the call procedure for this execution
        type: string
      description:
        description: A high level description of the execution
        type: string
      activity_report_content:
        description: input for activity report
        type: string
      data_review_content:
        description: input for data review
        type: string        
      run_for_score:
        description: true if the execution contains any procedure section that is run for record. This is set automatically when the execution is closed and should not be set from outside.
        type: boolean   
      url:
        type: string
        description: URL of the resource        
      version:
        description: Version of Ingenium that was used to create this execution
        type: string
      api_version:
        description: Indicates the version of the Ingenium API used in the execution of this test
        type: string
      flight_dictionary_version:
        description: The version of the flight dictionary selected for this execution
        type: string    
      sse_dictionary_version:
        description: The version of the SSE dictionary selected for this execution
        type: string         
      test_conductors:
        description: List of test conductors involved with the test. (First is the initiator of the test)
        uniqueItems: true        
        type: array
        items:
          type: string
      participants:
        description: List of users who can update inputs to step
        uniqueItems: true        
        type: array
        items:
          type: string
      redline_approvers:
        description: List of users who can approve redline/blueline changes
        uniqueItems: true        
        type: array
        items:
          type: string
      observers:
        description: List of users who observed the test
        uniqueItems: true        
        type: array
        items:
          type: string
      time_started:
        description: The time the test was started
        type: string
      time_completed:
        description: The time the test was completed
        type: string
      venue_name:
        description: The venue the test was executed on
        type: string          
      venue_id:
        description: Id of the venue the test was executed on
        type: string
      mode:
        description: execution mode
        type: string
        enum:
          - MANUAL      
          - AUTO
      delay:
        description: time in seconds to wait before executing the next step in AUTO mode    
        type: integer          
      pause_conditions:
        description: conditions to pause automatic execution
        type: object
        properties:
          on_fail:
            description: pause if step execution fails
            type: boolean        
          on_error:
            description: pause if step execution errors
            type: boolean
          on_section_end:
            description: pause if the end of section is reached
            type: boolean   
          on_procedure_end:
            description: pause if the end of procedure is reached
            type: boolean        
          on_manual_input:
            description: pause if the next step requires manual input
            type: boolean 
          on_command:
            description: pause if the next step is a fsw command or sse command step
            type: boolean 
          on_break_point:
            description: pause if the next step has a break point
            type: boolean                           
      boundary_elem_id:
          description: the next element that will stop the execution for AUTO mode.
          type: string             
      status:
        description: Status of execution       
        type: string
        enum:
          - RUNNING
          - IDLE
          - PAUSED
          - HALTED
          - SUSPENDED
          - CLOSED
          - IN_REVIEW          
          - FINALIZED
      transitions:
        type: array
        items:
          $ref: '#/definitions/ExecutionTransitionInfo'                                             
      files:
        type: array
        items:
          $ref: '#/definitions/FileInfo'
      current_step_id:
        description: id of the current step       
        type: string    
      current_step_number:
        description: number of the current step       
        type: string
      current_step_title:
        description: title of the current step       
        type: string    
      current_procedure_id:
        description: id of the current procedure
        type: string    
      current_procedure_title:
        description: title of the current procedure      
        type: string                      
      num_steps_executed:
        description: the number of steps executed
        type: integer 
      num_steps_passed:
        description: the number of steps that passed
        type: integer         
      num_steps_failed:
        description: the number of steps that failed
        type: integer  
      num_steps_errored:
        description: the number of steps that errored
        type: integer       
      used_procedures:
        # This field will be set when an execution is closed
        description: procedures used in this execution
        type: array
        items:
          type: object
          properties:
            procedure_id:
              type: string
              description: unique id of procedure
            title:
              type: string
              description: title of procedure              
            institutional_id:
              description: Unique id of the procedure in institutional CM (PBAT or JPL DOC)
              type: string                           
            version:
              type: integer
              description: procedure version   
            institutional_release_id:
              description: The corresponding release id in the institutional CM or JPL doc
              type: string            
            run_for_score:
              type: boolean
              description: true if run_for_score was true for the procedure                  
      comment_conversations_count:
        description: Number of general conversations
        type: integer
      unresolved_comment_conversations_count:
        description: Number of unresolved general conversations
        type: integer
      ar_conversations_count:
        description: Number of activity report conversations
        type: integer
      unresolved_ar_conversations_count:
        description: Number of unresolved activity report conversations
        type: integer
      dr_conversations_count:
        description: Number of data review conversations
        type: integer
      unresolved_dr_conversations_count:
        description: Number of unresolved data review conversations
        type: integer
      conversations_count:
        description: Number of conversations
        type: integer
      unresolved_conversations_count:
        description: Number of unresolved conversations
        type: integer
  ExecutionInfoInput:
    allOf:
    - $ref: '#/definitions/ExecutionInfo'
    required:
    - venue_id        

  DiscardInput:
    description: input to discard elements
    properties:
      elem_ids:
        description: ids of elements
        type: array
        items:
          type: string

  ExecutionTransitionInfo:
    description: status transition of execution
    properties:
      time_updated:
        description: Time the comment was created or updated
        type: string     
      user_name:
        description: name of the user who commented
        type: string
      from_status:
        description: status before the transition
        type: string        
        enum:        
          - RUNNING
          - IDLE
          - PAUSED
          - HALTED
          - SUSPENDED
          - CLOSED
          - IN_REVIEW
          - FINALIZED
      to_status:
        description: status after the transition
        type: string        
        enum:        
          - RUNNING
          - IDLE
          - PAUSED
          - HALTED
          - SUSPENDED
          - CLOSED
          - IN_REVIEW
          - FINALIZED
      comment:
        type: string
        description: comment text in HTML               

  ErrorResponse:
    properties:
      message:
        type: string
        description: error message
        
  StepError:
    description: error during step execution
    properties:
      message:
        type: string
        description: short error message
      details:
        type: array        
        description: details about the error that may include stack trace
        items:
          type: string  
      error_type:
        type: string        
        description: type of the error
        enum:
        - USER_INPUT_ERROR
        - INGENIUM_SERVICE_ERROR           
        - EXTERNAL_SERVICE_ERROR
        - DISPATCH_ERROR
        - VERIFICATION_ERROR
        - VENUE_SERVICE_ERROR
        - QUERY_ERROR
        - TIMEOUT
        - CONFIGURATION_ERROR
        - REPORTING_ERROR
        - DATA_PATH_ERROR
        - ELEMENT_NOT_FOUND
        - STEP_ERROR
        - CONDITION_EVALUATION_ERROR
        - CANNOT_RELATE_DATA_PATH
        - VALUE_CONVERSION_ERROR
        - TIME_VALIDATION_ERROR
      error_source:
        description: |
          Service or S/W component where the error occurred
        type: string
        enum:
        - AMPCS
        - VENUE_SERVICE          
        - EMBEDDED_CODE  
        - EXECUTION_KERNEL
        - EXECUTION_SERVICE
        - VENUE_CONFIGURATION
        - OTHER      
      http_code_at_source:
        type: integer
        description: HTTP response status code of the root error at the source. Zero if not applicable.

  ExecutionStatusInput:
    properties:
      status:
        description: Input status of execution
        type: string
        enum:
          - IDLE
          - RUNNING
          - SUSPENDED
          - CLOSED
          - IN_REVIEW
          - FINALIZED
      comment:
        description: Optional user comment regarding the status transition
        type: string
                  
  ExecutionStatus:
    properties:
      status:
        description: Status of execution
        type: string
        enum:
          - RUNNING
          - IDLE
          - PAUSED
          - HALTED
          - SUSPENDED
          - CLOSED
          - IN_REVIEW
          - FINALIZED 
        
  Variable:
    description: This maps the results of the step to a variable for use in guard functions 
    type: object
    properties:
      name: 
        description: Name of the variable that will be referenced
        type: string        
        
  Code:
    type: object
